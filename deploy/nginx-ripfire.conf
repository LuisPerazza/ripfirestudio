# nginx na frente do app: recebe o público na porta 80/443 e repassa pro
# Ripfire em 127.0.0.1:8787. Troque SEU-DOMINIO.com.br pelo seu domínio.
# O HTTPS (443) o certbot acrescenta sozinho (DEPLOY.md, passo 7).
server {
    listen 80;
    server_name SEU-DOMINIO.com.br www.SEU-DOMINIO.com.br;

    # Chapa de DTF grande passa fácil de 100 MB. Deixe acima do max_upload_mb
    # do config.json (600), senão o nginx recusa antes do app.
    client_max_body_size 700m;
    client_body_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        # IP real do cliente: os limites de tentativas de login usam ele.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
