<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Gerar hash de senha · Ripfire Studio</title>
  <link rel="icon" type="image/png" href="/static/img/logo.png">
  <link rel="stylesheet" href="/static/fonts/fonts.css">
  <script src="/static/theme.js?v=1"></script>
  <style>
    :root{--bg:#f5f5f5;--paper:#fff;--ink:#181818;--muted:#6b6b6b;--line:#e2e2e2;--accent:#9b59b6}
    html[data-theme="dark"]{color-scheme:dark;--bg:#121214;--paper:#1c1c1f;--ink:#ececef;--muted:#a2a2aa;--line:#2e2e33}
    *{box-sizing:border-box}
    body{margin:0;font-family:'Open Sans',Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
    main{max-width:560px;margin:40px auto;padding:30px;background:var(--paper);border:1px solid var(--line);border-radius:14px}
    h1{font-family:'Barlow',Arial,sans-serif;margin:0 0 6px;font-size:28px}
    p{color:var(--muted);font-size:14px}
    label{display:block;font-weight:700;font-size:13px;margin:14px 0 5px}
    input,textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:8px;padding:11px;background:var(--bg);color:var(--ink)}
    textarea{font-family:monospace;font-size:12px;height:96px;resize:none}
    button{margin-top:16px;width:100%;border:0;border-radius:9px;padding:13px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
    button[disabled]{opacity:.6;cursor:wait}
    .msg{margin-top:10px;font-weight:700;font-size:14px}.ok{color:#1f7d52}.err{color:#b3261e}
    html[data-theme="dark"] .ok{color:#4fd18b}html[data-theme="dark"] .err{color:#ff8a80}
  </style>
</head>
<body>
<main>
  <h1>Gerar hash de senha</h1>
  <p>Para colocar um login de admin no <b>config.json</b>. A senha é transformada aqui mesmo, no seu navegador: ela não é enviada para o site nem para ninguém. Cole no config.json só o resultado (o "hash").</p>
  <form id="f">
    <label for="p1">Senha nova (mínimo 12 caracteres)</label>
    <input id="p1" type="password" autocomplete="new-password" minlength="12" required>
    <label for="p2">Repita a senha</label>
    <input id="p2" type="password" autocomplete="new-password" minlength="12" required>
    <button id="go">Gerar hash</button>
  </form>
  <div id="msg" class="msg" role="status" aria-live="polite"></div>
  <label for="out">Hash para colar no "key" do config.json</label>
  <textarea id="out" readonly></textarea>
  <button type="button" id="copy">Copiar hash</button>
</main>
<script src="/static/gerar-hash.js?v=1"></script>
</body>
</html>
